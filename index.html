<!DOCTYPE html>
<html lang="en">

</head>

<body>

    <script>
        // Prompt the username
        let username = prompt('Welcome to Bear Hunter. Please type your name')

        let player = `${username}`
        // Print out welcome text
        alert('Hi ' + player + ' Let\'s Play!!');

        // Prompt the choose
        let choose = prompt('Who are you: Bear, Ninja or Hunter?')
        choose = choose.toLowerCase();

        // Print out on console
        console.log(player + ", You picked " + choose + "!")
        console.log("The computer picked Bear!")

        // Print out on HTML page
        document.getElementById("u-picked").innerHTML = player +", You picked " + choose + "!";
        document.getElementById("c-picked").innerHTML = "The computer picked Bear!";

        // hard coding computer's choice
        let computer = "hunter";

        // decide who will win
        let result = "";
        if (choose == "bear" && computer == "bear") {
            result = "tie"
        } else if (choose == "ninja" && computer == "ninja") {
            result = "tie"
        } else if (choose == "hunter" && computer == "hunter") {
            result = "tie" 
        } else if (choose == "bear" && computer == "ninja") {
            result = "user"
        } else if (choose == "ninja" && computer == "hunter") {
            result = "user"
        } else if (choose == "hunter" && computer == "bear") { 
            result = "user"
        } else if (choose == "hunter" && computer == "ninja"){ 
            result = "computer"
        }else if (choose == "bear" && computer == "hunter") {
            result = "computer"
        } else if (choose == "ninja" && computer == "bear") {
            result = "computer"
        } else {
            result = "unknown"
        }

        // print the result based on who win
        switch (result) {
            case "tie":
                console.log("Tie!!");
                document.getElementById("result").innerHTML = "Tie!!"
                break;
            case "user":
                console.log("You win!!");
                document.getElementById("result").innerHTML = "You win!!"
                break;
            case "computer":
                console.log("Computer wins!!");
                document.getElementById("result").innerHTML = "Computer Wins!!"
                break;
            default:
                console.log("Something went wrong")
                document.getElementById("result").innerHTML = "Something went wrong"
                break;
        }
    </script>
</body>

</html>
